name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Generate Changelog
        run: node scripts/generate-changelog.mjs
        working-directory: docs

      - name: Generate Related Clauses
        run: npm run docs:related
        working-directory: docs

      - name: Generate Page Catalog
        run: node scripts/generate-page-catalog.mjs
        working-directory: docs

      - name: Generate Clause Counts
        run: node scripts/generate-clause-counts.mjs
        working-directory: docs

      - name: Generate Section Index
        run: node scripts/generate-section-index.mjs
        working-directory: docs

      - name: Build VitePress
        run: npm run docs:build
        working-directory: docs

      - name: Patch Pagefind attributes
        run: node scripts/patch-pagefind.mjs
        working-directory: docs

      - name: Index with Pagefind
        run: npx pagefind --site .vitepress/dist
        working-directory: docs

      # ── Link health audit ───────────────────────────────────────────────────
      # Runs after the build so the source files are available for disk
      # resolution, but before upload so broken links never reach production
      # silently. The step always exits 0 (never blocks deployment) — issues
      # are surfaced in the GitHub Actions step summary and in the deployed
      # /link-report.json consumed by the admin dashboard.
      - name: Audit internal links (404 check)
        run: node scripts/audit-links.mjs --check-404 --summary
        working-directory: docs
        continue-on-error: true   # report without blocking deployment

      - name: Write link audit summary
        if: always()
        run: |
          REPORT="audit-links-report.txt"
          if [ -f "$REPORT" ]; then
            echo "## 🔗 Link Health Audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract just the summary block (first 60 lines covers header + counts)
            head -60 "$REPORT" | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Full report available in \`audit-links-report.txt\` artifact below._" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🔗 Link Health Audit" >> $GITHUB_STEP_SUMMARY
            echo "No report file generated." >> $GITHUB_STEP_SUMMARY
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload link audit report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: audit-links-report.txt
          retention-days: 30

      # ── Pages deployment ────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4